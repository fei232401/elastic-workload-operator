apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trainer-b-ckpt
  namespace: team-b
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trainer-b
  namespace: team-b
  labels:
    kueue.x-k8s.io/queue-name: training
    kueue.x-k8s.io/priority-class: batch
spec:
  suspend: true
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
      containers:
      - name: trainer
        image: ew-trainer:v1
        imagePullPolicy: IfNotPresent
        env:
        - {name: MIN_NODES, value: "1"}
        - {name: MAX_NODES, value: "1"}
        - {name: RDZV_ENDPOINT, value: "localhost:29400"}
        - {name: RDZV_ID, value: "trainer-b"}
        - {name: CHECKPOINT_DIR, value: /ckpt}
        - {name: TOTAL_STEPS, value: "3000"}
        resources:
          requests: {cpu: 600m, memory: 512Mi}
          limits: {cpu: 600m, memory: 512Mi}
        volumeMounts:
        - {name: ckpt, mountPath: /ckpt}
      volumes:
      - name: ckpt
        persistentVolumeClaim:
          claimName: trainer-b-ckpt
