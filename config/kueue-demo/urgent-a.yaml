apiVersion: batch/v1
kind: Job
metadata:
  name: urgent-a
  namespace: team-a
  labels:
    kueue.x-k8s.io/queue-name: training
    kueue.x-k8s.io/priority-class: urgent
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: work
        image: busybox:1.36
        command: ["sh", "-c", "sleep 45"]
        resources:
          requests: {cpu: 400m, memory: 128Mi}
          limits: {cpu: 400m, memory: 128Mi}
