# L2 演示清单:mock 数据面 + demo ElasticWorkload
#
# 数据面=mock Router(假 KV Router,按脚本吐 ttft_p95),工作负载=busybox 空跑
# (真 vLLM 需 GPU,本机 WSL/k3d 起不来 —— 诚实边界:这里验的是控制面闭环,
# 即 replicas 该涨该跌对得上,不是推理吞吐)。gpuPerWorker=0 → 不请求 GPU。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockrouter
  namespace: default
  labels:
    app: mockrouter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockrouter
  template:
    metadata:
      labels:
        app: mockrouter
    spec:
      containers:
      - name: mockrouter
        image: mockrouter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: default
spec:
  selector:
    app: mockrouter
  ports:
  - port: 8080
    targetPort: 8080
---
# demo:训练 4 / 推理 2,minHold=2 ticks(10s)→ 过载 80s 窗口内能看多步缩放
apiVersion: aiinfra.example.com/v1alpha1
kind: ElasticWorkload
metadata:
  name: demo
  namespace: default
spec:
  training:
    replicas: 4
    minReplicas: 1
    maxReplicas: 8
    gpuPerWorker: 0
    image: busybox:1.36
    command: ["sleep", "3600"]
  inference:
    replicas: 2
    minReplicas: 1
    maxReplicas: 8
    gpuPerInstance: 0
    image: busybox:1.36
    command: ["sleep", "3600"]
    prefixCaching: true
  scalingPolicy:
    targetMetric: ttft_p95
    slo: 300
    minHoldDuration: 2
    maxScaleStep: 1
