# This rule is not used by the project elastic-workload-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over aiinfra.aiinfra.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: elastic-workload-operator
    app.kubernetes.io/managed-by: kustomize
  name: elasticworkload-admin-role
rules:
- apiGroups:
  - aiinfra.aiinfra.example.com
  resources:
  - elasticworkloads
  verbs:
  - '*'
- apiGroups:
  - aiinfra.aiinfra.example.com
  resources:
  - elasticworkloads/status
  verbs:
  - get
