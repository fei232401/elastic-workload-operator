# This rule is not used by the project elastic-workload-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the aiinfra.aiinfra.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: elastic-workload-operator
    app.kubernetes.io/managed-by: kustomize
  name: elasticworkload-editor-role
rules:
- apiGroups:
  - aiinfra.aiinfra.example.com
  resources:
  - elasticworkloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aiinfra.aiinfra.example.com
  resources:
  - elasticworkloads/status
  verbs:
  - get
