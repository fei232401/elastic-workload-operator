---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: elasticworkloads.aiinfra.example.com
spec:
  group: aiinfra.example.com
  names:
    kind: ElasticWorkload
    listKind: ElasticWorkloadList
    plural: elasticworkloads
    singular: elasticworkload
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ElasticWorkload is the Schema for the elasticworkloads API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ElasticWorkload
            properties:
              inference:
                description: Inference is the latency-sensitive serving workload.
                properties:
                  command:
                    items:
                      type: string
                    type: array
                  gpuPerInstance:
                    description: GPUPerInstance is the nvidia.com/gpu count requested
                      by each instance; zero requests no GPU.
                    format: int32
                    minimum: 0
                    type: integer
                    x-kubernetes-validations:
                    - message: GPU units are immutable
                      rule: self == oldSelf
                  image:
                    type: string
                  maxReplicas:
                    description: MaxReplicas is the highest inference replica count
                      the controller may set.
                    format: int32
                    type: integer
                  minReplicas:
                    description: MinReplicas is the lowest inference replica count
                      the controller may set.
                    format: int32
                    type: integer
                  prefixCaching:
                    description: PrefixCaching is rejected by validation; engine flags
                      belong in Command.
                    type: boolean
                  readinessHTTP:
                    properties:
                      path:
                        default: /health
                        pattern: ^/
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - port
                    type: object
                  replicas:
                    description: Replicas is the initial number of inference instances.
                    format: int32
                    type: integer
                    x-kubernetes-validations:
                    - message: initial replicas are immutable; recreate the workload
                        to change its budget
                      rule: self == oldSelf
                  resources:
                    properties:
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: ResourceList is a set of (resource name, quantity)
                          pairs.
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: ResourceList is a set of (resource name, quantity)
                          pairs.
                        type: object
                    type: object
                required:
                - gpuPerInstance
                - image
                - maxReplicas
                - minReplicas
                - replicas
                type: object
                x-kubernetes-validations:
                - message: 'inference: minReplicas <= replicas <= maxReplicas'
                  rule: self.minReplicas <= self.replicas && self.replicas <= self.maxReplicas
              scalingPolicy:
                description: ScalingPolicy controls when replicas move between the
                  two workloads.
                properties:
                  maxScaleStep:
                    description: MaxScaleStep is the largest replica change per decision.
                    format: int32
                    type: integer
                  metrics:
                    description: Metrics selects the TTFT source for this workload;
                      unset fields fall back to the controller defaults.
                    properties:
                      model:
                        description: Model is the logical model whose TTFT window
                          is requested; the router must echo it back.
                        maxLength: 200
                        minLength: 1
                        type: string
                      routerURL:
                        description: RouterURL overrides the controller's --router-url
                          for this workload.
                        maxLength: 2048
                        pattern: ^https?://
                        type: string
                    type: object
                  minHoldDuration:
                    description: MinHoldDuration is the number of 5s ticks to wait
                      after a scaling action before deciding again.
                    format: int32
                    type: integer
                  slo:
                    description: SLO is the TTFT P95 threshold in milliseconds.
                    format: int32
                    type: integer
                  targetMetric:
                    enum:
                    - ttft_p95
                    type: string
                required:
                - maxScaleStep
                - minHoldDuration
                - slo
                - targetMetric
                type: object
                x-kubernetes-validations:
                - message: slo must be > 0
                  rule: self.slo > 0
                - message: minHoldDuration must be >= 0
                  rule: self.minHoldDuration >= 0
                - message: maxScaleStep must be >= 1
                  rule: self.maxScaleStep >= 1
              training:
                description: Training is the preemptible workload that lends replicas
                  to inference under load.
                properties:
                  checkpoint:
                    description: Checkpoint enables the checkpoint handshake before
                      training membership changes.
                    properties:
                      claimName:
                        description: |-
                          ClaimName is an existing PersistentVolumeClaim mounted at /ckpt in every training pod.
                          All ranks must share it so that any pod can report the latest checkpoint.
                        maxLength: 253
                        minLength: 1
                        type: string
                      port:
                        default: 8080
                        description: Port serves POST /checkpoint?id=N and GET /checkpoint
                          on every training pod.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      rendezvousPort:
                        default: 29400
                        description: RendezvousPort is the torchrun c10d rendezvous
                          port hosted by ordinal 0.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      timeoutSeconds:
                        default: 60
                        description: TimeoutSeconds bounds the wait for a requested
                          checkpoint before the handoff proceeds without it.
                        format: int32
                        maximum: 3600
                        minimum: 1
                        type: integer
                    required:
                    - claimName
                    type: object
                  command:
                    items:
                      type: string
                    type: array
                  gpuPerWorker:
                    description: GPUPerWorker is the nvidia.com/gpu count requested
                      by each worker; zero requests no GPU.
                    format: int32
                    minimum: 0
                    type: integer
                    x-kubernetes-validations:
                    - message: GPU units are immutable
                      rule: self == oldSelf
                  image:
                    type: string
                  maxReplicas:
                    description: MaxReplicas is the highest training replica count
                      the controller may set.
                    format: int32
                    type: integer
                  minReplicas:
                    description: MinReplicas is the lowest training replica count
                      the controller may set.
                    format: int32
                    type: integer
                  replicas:
                    description: Replicas is the initial number of training workers.
                    format: int32
                    type: integer
                    x-kubernetes-validations:
                    - message: initial replicas are immutable; recreate the workload
                        to change its budget
                      rule: self == oldSelf
                  resources:
                    properties:
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: ResourceList is a set of (resource name, quantity)
                          pairs.
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: ResourceList is a set of (resource name, quantity)
                          pairs.
                        type: object
                    type: object
                required:
                - gpuPerWorker
                - image
                - maxReplicas
                - minReplicas
                - replicas
                type: object
                x-kubernetes-validations:
                - message: 'training: minReplicas <= replicas <= maxReplicas'
                  rule: self.minReplicas <= self.replicas && self.replicas <= self.maxReplicas
            required:
            - inference
            - scalingPolicy
            - training
            type: object
            x-kubernetes-validations:
            - message: only equal GPU units per replica are supported
              rule: self.training.gpuPerWorker == self.inference.gpuPerInstance
          status:
            description: status defines the observed state of ElasticWorkload
            properties:
              conditions:
                description: Conditions include Initialized, Ready, Progressing and
                  MetricsReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredReplicas:
                description: DesiredReplicas is the committed target allocation that
                  child Deployments converge to.
                properties:
                  inference:
                    format: int32
                    type: integer
                  training:
                    format: int32
                    type: integer
                required:
                - inference
                - training
                type: object
              handoff:
                description: Handoff tracks an in-progress checkpointed replica transfer.
                properties:
                  checkpointID:
                    description: CheckpointID is the monotonically increasing request
                      identifier sent to the trainers.
                    format: int64
                    type: integer
                  checkpointStep:
                    format: int64
                    type: integer
                  checkpointTimedOut:
                    type: boolean
                  checkpointedAt:
                    format: date-time
                    type: string
                  from:
                    description: WorkloadReplicas holds a replica count for each workload.
                    properties:
                      inference:
                        format: int32
                        type: integer
                      training:
                        format: int32
                        type: integer
                    required:
                    - inference
                    - training
                    type: object
                  phase:
                    enum:
                    - CheckpointRequested
                    - Releasing
                    - Acquiring
                    type: string
                  releasedAt:
                    format: date-time
                    type: string
                  requestedAt:
                    format: date-time
                    type: string
                  to:
                    description: WorkloadReplicas holds a replica count for each workload.
                    properties:
                      inference:
                        format: int32
                        type: integer
                      training:
                        format: int32
                        type: integer
                    required:
                    - inference
                    - training
                    type: object
                required:
                - checkpointID
                - from
                - phase
                - requestedAt
                - to
                type: object
              lastCheckpointID:
                description: LastCheckpointID is the highest checkpoint request identifier
                  issued so far.
                format: int64
                type: integer
              phase:
                description: Phase is one of Pending, Progressing, Running, Degraded
                  or Deleting.
                type: string
              readyReplicas:
                description: ReadyReplicas is the observed ready replica count of
                  each child Deployment.
                properties:
                  inference:
                    format: int32
                    type: integer
                  training:
                    format: int32
                    type: integer
                required:
                - inference
                - training
                type: object
              scalingHistory:
                description: ScalingHistory keeps the most recent committed decisions.
                items:
                  description: ScalingEvent records one committed scaling decision.
                  properties:
                    action:
                      description: Action is the replica delta, for example "inference+1/training-1".
                      type: string
                    metric:
                      description: Metric is the observation that triggered the decision,
                        for example "ttft_p95=412ms".
                      type: string
                    reason:
                      description: Reason is overload or recovery.
                      type: string
                    time:
                      format: date-time
                      type: string
                  required:
                  - action
                  - reason
                  - time
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
